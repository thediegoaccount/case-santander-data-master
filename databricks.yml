        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_carga_sql_acoes
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.sql_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 10
          spark_conf:
            "spark.sql.shuffle.partitions": "100"
        timeout_seconds: 1800
        max_retries: 2

      - task_key: t_sql_fraude
        description: "Carga SQL Fraude"
        depends_on:
          - task_key: t3_fraude
        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_carga_sql_fraude
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.sql_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 10
          spark_conf:
            "spark.sql.shuffle.partitions": "100"
        timeout_seconds: 1800
        max_retries: 2

      - task_key: t_sql_clientes
        description: "Carga SQL Clientes"
        depends_on:
          - task_key: t7_corretora_analises
          - task_key: t9_scd
        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_carga_sql_clientes
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
