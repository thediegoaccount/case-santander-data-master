        timeout_seconds: 1800
        max_retries: 2

      - task_key: t_sql_macro
        description: "Carga SQL Macro"
        depends_on:
          - task_key: t3_bcb
          - task_key: t3_world_bank
          - task_key: t3_acoes_cambio
        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_carga_sql_macro
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.sql_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 10
