bundle:
  name: case-santander-data
  version: "1.0.0"
  description: "Pipeline de dados financeiros - Corretora Santander (Job Clusters)"

environments:
  hk:
    workspace:
      host: ${env.DATABRICKS_HOST_HK}
      root_path: /Workspace/Shared/bundles/case-santander-hk
    variables:
      environment: hk
      enable_streaming: false
      spark_version: "14.3.x-scala2.12"
      gold_workers: 2
      sql_workers: 1

  prod:
    workspace:
      host: ${env.DATABRICKS_HOST_PROD}
      root_path: /Workspace/Shared/bundles/case-santander-prod
    variables:
      environment: prod
      enable_streaming: true
      spark_version: "14.3.x-scala2.12"
      gold_workers: 4
      sql_workers: 2

variables:
  spark_version:
    description: "Versão do Spark para job clusters"
    default: "14.3.x-scala2.12"

  gold_workers:
    description: "Número de workers para jobs de análise (gold)"
    default: 2

  sql_workers:
    description: "Número de workers para jobs de carga SQL"
    default: 1

  environment:
    description: "Ambiente de execução (hk/prod)"
    default: "hk"

  enable_streaming:
    description: "Habilita processamento de streaming"
    default: false

resources:
  #  DATABRICKS REPOS (Git Sync) 
  repos:
    case_santander_main:
      url: "https://github.com/thediegoaccount/case-santander-data-master"
      branch: "main"
      path: /Repos/diego.silva0001@gmail.com/case-santander-data-master

  #  JOBS: GOLD MARKET ANALYSIS (Jobs Individuais - Sem Schedule) 
  # Nota: Jobs individuais sem schedule - controlados pelo workflow pai
  jobs:
    t3_gold_anomalias:
      name: "[${var.environment}] t3 - Gold Anomalias"
      description: "Detecta anomalias em movimentação de ações via z-score"
      tags:
        team: data-engineering
        layer: gold
        source: yahoo-finance
        cluster_type: job

      tasks:
        - task_key: anomalias
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_anomalias
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2
          retry_on_timeout: false

    t3_gold_performance:
      name: "[${var.environment}] t3 - Gold Performance Ações"
      description: "Calcula performance média das ações por setor e ano"
      tags:
        team: data-engineering
        layer: gold
        source: yahoo-finance
        cluster_type: job

      tasks:
        - task_key: performance
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_performance
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_bcb:
      name: "[${var.environment}] t3 - Gold BCB Indicadores"
      description: "Análise de Selic, Câmbio USD/BRL e IPCA do Banco Central"
      tags:
        team: data-engineering
        layer: gold
        source: bcb-api
        cluster_type: job

      tasks:
        - task_key: bcb
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_bcb
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_world_bank:
      name: "[${var.environment}] t3 - Gold World Bank Contexto"
      description: "Análise macroeconômica: PIB e Desemprego"
      tags:
        team: data-engineering
        layer: gold
        source: world-bank-api
        cluster_type: job

      tasks:
        - task_key: world_bank
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_world_bank
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_acoes_cambio:
      name: "[${var.environment}] t3 - Gold Ações vs Câmbio"
      description: "Correlação entre performance de ações e variações do câmbio USD/BRL"
      tags:
        team: data-engineering
        layer: gold
        source: multi
        cluster_type: job

      tasks:
        - task_key: acoes_cambio
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_acoes_vs_cambio
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_fraude:
      name: "[${var.environment}] t3 - Gold Fraude"
      description: "Detecção de fraudes em ordens de clientes"
      tags:
        team: data-engineering
        layer: gold
        source: clientes
        cluster_type: job

      tasks:
        - task_key: fraude
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_gold_fraude
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.gold_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 15
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
          timeout_seconds: 3600
          max_retries: 2

  #  JOBS: CARGA SQL 
    t_carga_sql_acoes:
      name: "[${var.environment}] Carga SQL - Ações"
      description: "Carrega performance_acoes e anomalias no SQL Database"
      tags:
        team: data-engineering
        layer: sql
        target: azure-sql
        cluster_type: job

      tasks:
        - task_key: sql_acoes
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_carga_sql_acoes
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.sql_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 10
            spark_conf:
              "spark.sql.shuffle.partitions": "100"
          timeout_seconds: 1800
          max_retries: 2

    t_carga_sql_clientes:
      name: "[${var.environment}] Carga SQL - Clientes"
      description: "Carrega 5 tabelas de análise de clientes"
      tags:
        team: data-engineering
        layer: sql
        target: azure-sql
        cluster_type: job

      tasks:
        - task_key: sql_clientes
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_carga_sql_clientes
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.sql_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 10
            spark_conf:
              "spark.sql.shuffle.partitions": "100"
          timeout_seconds: 1800
          max_retries: 2

    t_carga_sql_fraude:
      name: "[${var.environment}] Carga SQL - Fraude"
      description: "Carrega deteccao_fraude"
      tags:
        team: data-engineering
        layer: sql
        target: azure-sql
        cluster_type: job

      tasks:
        - task_key: sql_fraude
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_carga_sql_fraude
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.sql_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 10
            spark_conf:
              "spark.sql.shuffle.partitions": "100"
          timeout_seconds: 1800
          max_retries: 2

    t_carga_sql_streaming:
      name: "[${var.environment}] Carga SQL - Streaming"
      description: "Carrega 4 tabelas de análise real-time"
      tags:
        team: data-engineering
        layer: sql
        target: azure-sql
        cluster_type: job

      tasks:
        - task_key: sql_streaming
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_carga_sql_streaming
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
            num_workers: ${var.sql_workers}
            aws_attributes:
              availability: "SPOT"
              zone_id: "us-west-2a"
            idle_timeout_minutes: 10
            spark_conf:
              "spark.sql.shuffle.partitions": "100"
          timeout_seconds: 1800
          max_retries: 2

    t_carga_sql_macro:
      name: "[${var.environment}] Carga SQL - Indicadores Macro"
      description: "Carrega indicadores BCB, contexto macroeconômico e correlações"
      tags:
        team: data-engineering
        layer: sql
        target: azure-sql
        cluster_type: job

      tasks:
        - task_key: sql_macro
          python_wheel_task:
            package_name: case_santander
            entry_point: jobs.job_carga_sql_macro
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "i3.xlarge"
