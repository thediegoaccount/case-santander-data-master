        # Depende das folhas da camada Gold (t3_acoes_cambio cobre t3_performance e t3_bcb;
        # t3_fraude cobre t7_corretora_analises e t9_scd)
        depends_on:
          - task_key: t8_lakehouse_monitoring
        python_wheel_task:
          package_name: case_santander
          entry_point: job_unity_catalog
        libraries:
          - whl: ./dist/*.whl
        new_cluster:
          spark_env_vars:
            ENVIRONMENT: "${var.environment}"
          spark_version: ${var.spark_version}
          node_type_id: "Standard_DS3_v2"
          num_workers: ${var.sql_workers}
          azure_attributes:
            availability: "SPOT_WITH_FALLBACK_AZURE"
            first_on_demand: 1
        timeout_seconds: 3600
        max_retries: 2

      - task_key: t4_observabilidade
        description: "Observabilidade"
        depends_on:
          - task_key: t8b_uc_registro
        python_wheel_task:
          package_name: case_santander
          entry_point: job_observabilidade
        libraries:
          - whl: ./dist/*.whl
        new_cluster:
          spark_env_vars:
            ENVIRONMENT: "${var.environment}"
          spark_version: ${var.spark_version}
          node_type_id: "Standard_DS3_v2"
          num_workers: ${var.sql_workers}
          azure_attributes:
            availability: "SPOT_WITH_FALLBACK_AZURE"
            first_on_demand: 1
        timeout_seconds: 3600
        max_retries: 2

      # Schedule único para o workflow pai
      # (precisa ficar aninhado em pipeline_completo — com 4 espaços virava um
      #  job fantasma chamado "schedule" e o pipeline era implantado sem agendamento)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # 06:00 BRT todo dia
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

targets:
  # Ambiente de Homologação (Job Clusters - Menores)
  hk:
    mode: development
    variables:
      spark_version: "14.3.x-scala2.12"
      gold_workers: 2
      sql_workers: 1
      environment: hk
      enable_streaming: false
    workspace:
      host: ${env.DATABRICKS_HOST_HK}
      root_path: /Workspace/Shared/bundles/case-santander-hk
    # Homologacao nao roda streaming (enable_streaming: false). O override
    # abaixo torna isso explicito: antes, o unico freio era o efeito
    # colateral de `mode: development` pausar schedules, que desapareceria
    # se este target virasse `mode: production`.
    resources:
      jobs:
        streaming_to_gold_continuous:
          schedule:
            pause_status: PAUSED

  # Ambiente de Produção (Job Clusters - Maiores)
  prod:
    mode: production
    variables:
      spark_version: "14.3.x-scala2.12"
      gold_workers: 4
      sql_workers: 2
      environment: prod
      enable_streaming: true
    workspace:
      host: ${env.DATABRICKS_HOST_PROD}
      root_path: /Workspace/Shared/bundles/case-santander-prod
