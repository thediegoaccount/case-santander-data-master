        timeout_seconds: 1800
        max_retries: 2

      #  FINALIZAÇÃO
      - task_key: t8_lakehouse_monitoring
        description: "Lakehouse Monitoring"
        depends_on:
          - task_key: t_sql_acoes
          - task_key: t_sql_clientes
          - task_key: t_sql_fraude
          - task_key: t_sql_streaming
          - task_key: t_sql_macro
        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_lakehouse_monitoring
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.sql_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 10
        timeout_seconds: 3600
        max_retries: 2

      - task_key: t4_observabilidade
        description: "Observabilidade"
        depends_on:
          - task_key: t_sql_acoes
          - task_key: t_sql_clientes
          - task_key: t_sql_fraude
          - task_key: t_sql_streaming
          - task_key: t_sql_macro
