        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.gold_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 15
        timeout_seconds: 3600
        max_retries: 2

      #  GOLD CLIENT (Sequencial)
      - task_key: t7_corretora_analises
        description: "Corretora Análises"
        depends_on:
          - task_key: t6_clientes_silver
        python_wheel_task:
          package_name: case_santander
          entry_point: jobs.job_corretora_analises
        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
