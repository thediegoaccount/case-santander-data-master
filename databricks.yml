          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 10
        timeout_seconds: 3600
        max_retries: 2

    # Schedule único para o workflow pai
    schedule:
      quartz_cron_expression: "0 6 * * ?"  # 06:00 BRT todo dia
      timezone_id: "America/Sao_Paulo"
      pause_status: UNPAUSED

targets:
  # Ambiente de Homologação (Job Clusters - Menores)
  hk:
    mode: development
    variables:
      spark_version: "14.3.x-scala2.12"
      gold_workers: 2
      sql_workers: 1
      environment: hk
      enable_streaming: false
    workspace:
      host: ${env.DATABRICKS_HOST_HK}
      root_path: /Workspace/Shared/bundles/case-santander-hk

  # Ambiente de Produção (Job Clusters - Maiores)
  prod:
    mode: production
    variables:
      spark_version: "14.3.x-scala2.12"
      gold_workers: 4
      sql_workers: 2
      environment: prod
      enable_streaming: true
    workspace:
      host: ${env.DATABRICKS_HOST_PROD}
      root_path: /Workspace/Shared/bundles/case-santander-prod
