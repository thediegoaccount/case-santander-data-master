        new_cluster:
          spark_version: ${var.spark_version}
          node_type_id: "i3.xlarge"
          num_workers: ${var.gold_workers}
          aws_attributes:
            availability: "SPOT"
            zone_id: "us-west-2a"
          idle_timeout_minutes: 15
        timeout_seconds: 3600
        max_retries: 2

      - task_key: t1_extracao_world_bank
