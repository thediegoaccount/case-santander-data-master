bundle:
  name: case-santander-data
  version: "1.0.0"
  description: "Pipeline de dados financeiros - Corretora Santander (Job Clusters)"

variables:
  spark_version:
    description: "Versão do Spark para job clusters"
    default: "14.3.x-scala2.12"

  gold_workers:
    description: "Número de workers para jobs de análise (gold)"
    default: 2

  sql_workers:
    description: "Número de workers para jobs de carga SQL"
    default: 1

  environment:
    description: "Ambiente de execução (hk/prod)"
    default: "hk"

  enable_streaming:
    description: "Habilita processamento de streaming"
    default: false

# Sem este bloco nenhum wheel era construido, e as tasks python_wheel_task
# falhavam com ModuleNotFoundError: case_santander.
artifacts:
  case_santander_wheel:
    type: whl
    build: python setup.py bdist_wheel
    path: .

resources:
  #  JOBS: GOLD MARKET ANALYSIS (Jobs Individuais - Sem Schedule) 
  # Nota: Jobs individuais sem schedule - controlados pelo workflow pai
  jobs:
    t3_gold_anomalias:
      name: "[${var.environment}] t3 - Gold Anomalias"
      description: "Detecta anomalias em movimentação de ações via z-score"
      tags:
        team: data-engineering
        layer: gold
        source: yahoo-finance
        cluster_type: job

      tasks:
        - task_key: anomalias
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_anomalias
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2
          retry_on_timeout: false

    t3_gold_performance:
      name: "[${var.environment}] t3 - Gold Performance Ações"
      description: "Calcula performance média das ações por setor e ano"
      tags:
        team: data-engineering
        layer: gold
        source: yahoo-finance
        cluster_type: job

      tasks:
        - task_key: performance
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_performance
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_bcb:
      name: "[${var.environment}] t3 - Gold BCB Indicadores"
      description: "Análise de Selic, Câmbio USD/BRL e IPCA do Banco Central"
      tags:
        team: data-engineering
        layer: gold
        source: bcb-api
        cluster_type: job

      tasks:
        - task_key: bcb
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_bcb
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_world_bank:
      name: "[${var.environment}] t3 - Gold World Bank Contexto"
      description: "Análise macroeconômica: PIB e Desemprego"
      tags:
        team: data-engineering
        layer: gold
        source: world-bank-api
        cluster_type: job

      tasks:
        - task_key: world_bank
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_world_bank
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_acoes_cambio:
      name: "[${var.environment}] t3 - Gold Ações vs Câmbio"
      description: "Correlação entre performance de ações e variações do câmbio USD/BRL"
      tags:
        team: data-engineering
        layer: gold
        source: multi
        cluster_type: job

      tasks:
        - task_key: acoes_cambio
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_acoes_vs_cambio
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2

    t3_gold_fraude:
      name: "[${var.environment}] t3 - Gold Fraude"
      description: "Detecção de fraudes em ordens de clientes"
      tags:
        team: data-engineering
        layer: gold
        source: clientes
        cluster_type: job

      tasks:
        - task_key: fraude
          python_wheel_task:
            package_name: case_santander
            entry_point: job_gold_fraude
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
            spark_conf:
              "spark.databricks.delta.schema.autoMerge.enabled": "true"
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
          timeout_seconds: 3600
          max_retries: 2

    #  STREAMING CONTÍNUO (Serviço 24/7 - Independente do pipeline diário)
    streaming_continuous:
      name: "[${var.environment}] Streaming Contínuo"
      description: "Serviço de streaming 24/7 - Aguarda atualizações do Event Hub"
      tags:
        team: data-engineering
        layer: streaming
        type: continuous-service
        cluster_type: job

      tasks:
        - task_key: streaming_continuous
          python_wheel_task:
            package_name: case_santander
            entry_point: job_streaming_continuous
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
          timeout_seconds: 0  # Sem timeout (serviço contínuo)
          max_retries: 0  # Sem retries (serviço contínuo)

      # Sem schedule - roda como serviço contínuo
      # Condicionado à variável enable_streaming

    #  STREAMING TO GOLD (Agendado - Processa dados de streaming para Gold)
    streaming_to_gold_continuous:
      name: "[${var.environment}] Streaming to Gold (Agendado)"
      description: "Processa dados de streaming para Gold a cada 5 minutos"
      tags:
        team: data-engineering
        layer: gold
        source: streaming
        cluster_type: job

      tasks:
        - task_key: streaming_to_gold
          python_wheel_task:
            package_name: case_santander
            entry_point: job_streaming_to_gold_continuous
          libraries:
            - whl: ./dist/*.whl
          new_cluster:
            spark_env_vars:
              ENVIRONMENT: "${var.environment}"
            spark_version: ${var.spark_version}
            node_type_id: "Standard_DS3_v2"
            num_workers: ${var.gold_workers}
            azure_attributes:
              availability: "SPOT_WITH_FALLBACK_AZURE"
              first_on_demand: 1
          timeout_seconds: 3600
          max_retries: 2

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"  # A cada 5 minutos
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

    #  WORKFLOW PAI: PIPELINE COMPLETO COM DEPENDÊNCIAS 
    pipeline_completo:
      name: "[${var.environment}] Pipeline Completo - Corretora Santander"
      description: "Workflow pai com todas as dependências do pipeline"
      tags:
        team: data-engineering
        layer: orchestration
        type: master-workflow

      tasks:
      #  SETUP
      - task_key: t0_unity_catalog
        description: "Cria os schemas do Unity Catalog (sem dependencia de dado)"
        python_wheel_task:
          package_name: case_santander
          entry_point: job_unity_catalog_schemas
        libraries:
          - whl: ./dist/*.whl
        new_cluster:
          spark_env_vars:
            ENVIRONMENT: "${var.environment}"
          spark_version: ${var.spark_version}
          node_type_id: "Standard_DS3_v2"
          num_workers: ${var.gold_workers}
          azure_attributes:
            availability: "SPOT_WITH_FALLBACK_AZURE"
            first_on_demand: 1
        timeout_seconds: 1800
        max_retries: 2

      #  INGESTION (Paralelo) 
      - task_key: t1_extracao_acoes
        description: "Extração Yahoo Finance"
        depends_on:
          - task_key: t0_unity_catalog
        python_wheel_task:
          package_name: case_santander
          entry_point: job_extracao_acoes
        libraries:
