# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose — Ambiente Enterprise (CeleryExecutor)
#
# Padrão: 1 container por serviço — separação de responsabilidades
#
#   postgres         → metadata DB do Airflow
#   redis            → message broker (fila Celery)
#   airflow-webserver→ UI apenas (nunca executa tasks)
#   airflow-scheduler→ orquestra e enfileira (nunca executa tasks)
#   airflow-worker   → executa as tasks (escalável horizontalmente)
#   airflow-triggerer→ operadores assíncronos/deferidos
#   flower           → dashboard de monitoramento dos workers
#
# Uso:
#   # Inicializar (primeira vez)
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up airflow-init
#
#   # Subir stack completa
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d
#
#   # Escalar workers horizontalmente
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d --scale airflow-worker=3
#
#   # Monitorar workers
#   http://localhost:5555  (Flower)
#   http://localhost:8080  (Airflow UI)
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.prod
  environment:
    # CeleryExecutor: scheduler enfileira, workers executam
    AIRFLOW__CORE__EXECUTOR:                    CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL:                redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND:            db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY:                  ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES:               'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG:          'false'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL:  30
    # Conexão Databricks injetada via env
    DATABRICKS_HOST:  ${DATABRICKS_HOST}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── 1. POSTGRES — Metadata DB ──────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: santander-postgres
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped
    networks:
      - santander-net

  # ── 2. REDIS — Message Broker (fila Celery) ────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: santander-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped
    networks:
      - santander-net

  # ── 3. AIRFLOW WEBSERVER — UI apenas ───────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: santander-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test:     ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout:  10s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - santander-net

  # ── 4. AIRFLOW SCHEDULER — Orquestra e enfileira ───────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: santander-scheduler
    command: scheduler
    healthcheck:
      test:     ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout:  10s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - santander-net

  # ── 5. AIRFLOW WORKER — Executa tasks (escalável) ──────────────────────────
  airflow-worker:
    <<: *airflow-common
    container_name: santander-worker
    command: celery worker
    environment:
      # Herda x-airflow-common e adiciona config do worker
      AIRFLOW__CELERY__WORKER_CONCURRENCY: 4
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" --timeout 10'
      interval: 30s
      timeout:  15s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 2g
      # Escale com: docker compose up -d --scale airflow-worker=N
      replicas: 1
    networks:
      - santander-net

  # ── 6. AIRFLOW TRIGGERER — Operadores assíncronos ──────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    container_name: santander-triggerer
    command: triggerer
    healthcheck:
      test:     ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout:  10s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - santander-net

  # ── 7. FLOWER — Dashboard de monitoramento dos workers ─────────────────────
  flower:
    <<: *airflow-common
    container_name: santander-flower
    command: celery flower
    ports:
      - "5555:5555"
    healthcheck:
      test:     ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout:  10s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - santander-net

  # ── INIT — Executa uma vez para setup inicial ───────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: santander-init
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@santander.com
          --password admin &&
        airflow connections add databricks_default
          --conn-type databricks
          --conn-host ${DATABRICKS_HOST}
          --conn-password ${DATABRICKS_TOKEN}
      "
    restart: "no"
    networks:
      - santander-net

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-db:
  redis-data:
  airflow-logs:
  airflow-plugins:

networks:
  santander-net:
    driver: bridge
    name: santander-data-network
