name: CI/CD Pipeline - Case Santander

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Integracao Continua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pytest yfinance requests azure-eventhub

      - name: Rodar testes
        run: pytest tests/ -v

      - name: Validar modulos src/
        run: |
          echo "Validando modulos..."
          for f in src/**/*.py jobs/*.py; do
            python -m py_compile "$f" && echo "OK: $f" || echo "ERRO: $f"
          done

  deploy-dev:
    name: Deploy Development
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Instalar Databricks CLI
        run: pip install databricks-cli

      - name: Deploy Dev
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DEPLOY_PATH:      ${{ secrets.DEPLOY_PATH }}
        run: |
          databricks configure --token <<< "$DATABRICKS_HOST
          $DATABRICKS_TOKEN"

          # Deploy src/
          databricks workspace mkdirs $DEPLOY_PATH/src/config
          databricks workspace mkdirs $DEPLOY_PATH/src/ingestion
          databricks workspace mkdirs $DEPLOY_PATH/src/transformation
          databricks workspace mkdirs $DEPLOY_PATH/src/gold
          databricks workspace mkdirs $DEPLOY_PATH/src/clients
          databricks workspace mkdirs $DEPLOY_PATH/src/observability
          databricks workspace mkdirs $DEPLOY_PATH/src/streaming

          for f in src/**/*.py; do
            dir=$(dirname $f)
            databricks workspace import "$f" \
              "$DEPLOY_PATH/$f" \
              --language PYTHON --overwrite
          done

          # Deploy jobs/
          databricks workspace mkdirs $DEPLOY_PATH/jobs
          for f in jobs/*.py; do
            databricks workspace import "$f" \
              "$DEPLOY_PATH/$f" \
              --language PYTHON --overwrite
          done

          echo "Deploy Dev concluido em $DEPLOY_PATH"

  deploy-hk:
    name: Deploy HK
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: hk
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Instalar Databricks CLI
        run: pip install databricks-cli

      - name: Deploy HK
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DEPLOY_PATH:      ${{ secrets.DEPLOY_PATH }}
        run: |
          databricks configure --token <<< "$DATABRICKS_HOST
          $DATABRICKS_TOKEN"

          databricks workspace mkdirs $DEPLOY_PATH/src/config
          databricks workspace mkdirs $DEPLOY_PATH/src/ingestion
          databricks workspace mkdirs $DEPLOY_PATH/src/transformation
          databricks workspace mkdirs $DEPLOY_PATH/src/gold
          databricks workspace mkdirs $DEPLOY_PATH/src/observability
          databricks workspace mkdirs $DEPLOY_PATH/jobs

          for f in src/**/*.py jobs/*.py; do
            databricks workspace import "$f" \
              "$DEPLOY_PATH/$f" \
              --language PYTHON --overwrite
          done

          echo "Deploy HK concluido em $DEPLOY_PATH"

  deploy-prod:
    name: Deploy Production
    needs: deploy-hk
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Instalar Databricks CLI
        run: pip install databricks-cli

      - name: Deploy Prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DEPLOY_PATH:      ${{ secrets.DEPLOY_PATH }}
        run: |
          databricks configure --token <<< "$DATABRICKS_HOST
          $DATABRICKS_TOKEN"

          databricks workspace mkdirs $DEPLOY_PATH/src/config
          databricks workspace mkdirs $DEPLOY_PATH/src/ingestion
          databricks workspace mkdirs $DEPLOY_PATH/src/transformation
          databricks workspace mkdirs $DEPLOY_PATH/src/gold
          databricks workspace mkdirs $DEPLOY_PATH/src/observability
          databricks workspace mkdirs $DEPLOY_PATH/jobs

          for f in src/**/*.py jobs/*.py; do
            databricks workspace import "$f" \
              "$DEPLOY_PATH/$f" \
              --language PYTHON --overwrite
          done

          echo "Deploy Prod concluido em $DEPLOY_PATH"
