name: CI/CD Pipeline - Case Santander Data

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  TERRAFORM_VERSION: '1.5'

jobs:
  # ========================================
  # VALIDAÇÃO E TESTES
  # ========================================
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-spark pandas pyspark pyyaml
      
      - name: Run lint
        run: |
          pip install flake8
          # --extend-ignore preserva os defaults do flake8 (E121,E123,E126,E226,E24,E704,W503,W504)
          # e adiciona: E501 (linha longa, já coberto por black), E203 (incompatível com black),
          # E122/E128 (indentação de continuação — conflita com os method chains do PySpark
          # deliberadamente preservados via "# fmt: off" em src/gold/*.py)
          flake8 src/ --max-line-length=120 --extend-ignore=E501,E203,E122,E128
      
      - name: Run data quality tests
        run: |
          pytest tests/ -v
      
      - name: Check syntax
        run: |
          python -m py_compile jobs/*.py
          python -m compileall -q src/ jobs/ dags/ config/
  
  # ========================================
  # BUILD E TESTE DE AMBIENTE HK
  # ========================================
  build-hk:
    name: Build & Test HK
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: homologation
      url: https://adb-xxx-hk.azuredatabricks.net
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Configure Databricks CLI (HK)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_HK }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_HK }}
        run: |
          databricks configure --host $DATABRICKS_HOST --token $DATABRICKS_TOKEN
      
      - name: Validate Databricks Bundle (HK)
        run: |
          databricks bundle validate -t hk
      
      - name: Deploy to HK
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_HK }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_HK }}
        run: |
          databricks bundle deploy -t hk --force
  
  # ========================================
  # BUILD E TESTE DE AMBIENTE PROD
  # ========================================
  build-prod:
    name: Build & Test PROD
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://adb-xxx.azuredatabricks.net
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Configure Databricks CLI (PROD)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          databricks configure --host $DATABRICKS_HOST --token $DATABRICKS_TOKEN
      
      - name: Validate Databricks Bundle (PROD)
        run: |
          databricks bundle validate -t prod
      
      - name: Deploy to PROD
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          databricks bundle deploy -t prod --force
  
  # ========================================
  # ATUALIZAÇÃO AUTOMÁTICA DO AIRFLOW DAG
  # ========================================
  update-airflow-dag:
    name: Update Airflow DAG
    runs-on: ubuntu-latest
    needs: [build-hk, build-prod]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Generate DAG from databricks.yml
        run: |
          python scripts/auto_generate_dag.py
      
      - name: Commit DAG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dags/dag_pipeline_santander_auto.py
          git diff --staged --quiet || git commit -m "chore: update Airflow DAG from databricks.yml [skip ci]"
      
      - name: Push DAG
        run: |
          git push
  
  # ========================================
  # DEPLOY TERRAFORM (OPCIONAL)
  # ========================================
  deploy-terraform-hk:
    name: Deploy Terraform HK
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: homologation-terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure Azure credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HK }}
      
      - name: Terraform Init (HK)
        run: |
          cd terraform
          terraform init -backend-config="key=case-santander-data-hk.tfstate"
      
      - name: Terraform Plan (HK)
        run: |
          cd terraform
          terraform plan -var-file=environments/hk.tfvars -out=tfplan
      
      - name: Terraform Apply (HK)
        run: |
          cd terraform
          terraform apply tfplan
  
  deploy-terraform-prod:
    name: Deploy Terraform PROD
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure Azure credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
      
      - name: Terraform Init (PROD)
        run: |
          cd terraform
          terraform init -backend-config="key=case-santander-data-prod.tfstate"
      
      - name: Terraform Plan (PROD)
        run: |
          cd terraform
          terraform plan -var-file=environments/prod.tfvars -out=tfplan
      
      - name: Terraform Apply (PROD)
        run: |
          cd terraform
          terraform apply tfplan
  
  # ========================================
  # HEALTH CHECKS PÓS-DEPLOY
  # ========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [build-hk, build-prod]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install databricks-connect
      
      - name: Health Check HK
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_HK }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_HK }}
        run: |
          python -c "
          from databricks.connect import DatabricksSession
          spark = DatabricksSession.builder.getOrCreate()
          spark.sql('SELECT 1').collect()
          print('HK Health Check: OK')
          "
      
      - name: Health Check PROD
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          python -c "
          from databricks.connect import DatabricksSession
          spark = DatabricksSession.builder.getOrCreate()
          spark.sql('SELECT 1').collect()
          print('PROD Health Check: OK')
          "
  
  # ========================================
  # NOTIFICAÇÃO
  # ========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [validate, build-hk, build-prod, update-airflow-dag, health-check]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.build-hk.result == 'success' && needs.build-prod.result == 'success'
        run: |
          echo "Deploy realizado com sucesso!"
          # Aqui pode adicionar Slack, Email, etc.
      
      - name: Notify Failure
        if: needs.validate.result == 'failure' || needs.build-hk.result == 'failure' || needs.build-prod.result == 'failure'
        run: |
          echo "Deploy falhou!"
          # Aqui pode adicionar Slack, Email, etc.
